uid: REQ-0011
type: requirement
status: ratified
title: A published address is never abandoned
text: During active development addresses move often. When content moves, the old
  address redirects permanently to the new one. When content is withdrawn, the old
  address returns 410 with a page that says the content has gone and where to go
  instead. An address that once answered does not start returning 404.
rationale: 'Rejected: leaving old addresses to 404 because nobody has linked to them
  yet. The site cannot know who has linked to them. Who pays: the developer, who
  keeps a redirect list. It is a few lines per move.'
normative: true
