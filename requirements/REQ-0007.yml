uid: REQ-0007
type: requirement
status: ratified
title: A holding page loads nothing from a third party
text: 'A holding page references no third-party resource: no external font, script,
  stylesheet, image or analytics. Everything it needs is served from its own origin
  or inlined. It can therefore load with no network access beyond its own host, and
  it tells no one else that the visitor came.'
rationale: 'Who pays: the page''s author, who gives up a web font and a visitor counter.
  The page exists for minutes of a visitor''s time across its whole life. A third-party
  request costs privacy and a dependency for nothing.'
normative: true
